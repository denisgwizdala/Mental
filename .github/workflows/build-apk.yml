name: Build Android APK

on:
  push:
    branches:
      - claude/wellness-tracking-app-RRnv5
    paths:
      - 'MentalBuildingApp/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x MentalBuildingApp/gradlew

      - name: Build Debug APK
        run: |
          cd MentalBuildingApp
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mental-building-debug
          path: MentalBuildingApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: preview-${{ github.run_number }}
          name: Preview Build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: MentalBuildingApp/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
